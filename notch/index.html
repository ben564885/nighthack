<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notch</title>
<link rel="icon" href="/assets/favicon.svg?v=2" type="image/svg+xml">
<style>
  :root {
    --ink: #fff;
    --dim: rgba(255, 255, 255, .56);
    --faint: rgba(255, 255, 255, .14);
    --ok: #32d74b;
    --warn: #ffb340;
    --bad: #ff453a;
    --scan: #64d2ff;
    --accent: var(--scan);
    --ease: cubic-bezier(.32, .72, 0, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% -10%, #20222c 0%, #0b0c10 60%, #07080a 100%);
    color: var(--ink);
    font: 500 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body.overlay { background: transparent; }

  /* native mode: the page sits in a transparent window over the real hardware notch.
     closed = exactly the hardware notch, so it is invisible. open = grows downward. */
  body.native { background: transparent; }
  body.native .notch { border-radius: 0 0 9px 9px; }
  body.native[data-open="false"] .notch { box-shadow: none; }
  body.native[data-open="false"] .notch::before, body.native[data-open="false"] .notch::after { display: none; }
  body.native[data-open="true"] .notch { border-radius: 0 0 28px 28px; }
  body.native .hint { display: none; }

  /* ---------- the notch ---------- */
  .notch {
    position: fixed; top: 0; left: 50%;
    transform: translateX(-50%);
    width: var(--nw, 188px); height: var(--nh, 34px);
    background: #000;
    border-radius: 0 0 20px 20px;
    transition: width .55s var(--ease), height .55s var(--ease), border-radius .55s var(--ease);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }
  /* inverse corners so it melts into the top edge like the hardware notch */
  .notch::before, .notch::after {
    content: ""; position: absolute; top: 0; width: 16px; height: 16px; pointer-events: none;
  }
  .notch::before { left: -16px; background: radial-gradient(circle at 0 100%, transparent 15.5px, #000 16px); }
  .notch::after  { right: -16px; background: radial-gradient(circle at 100% 100%, transparent 15.5px, #000 16px); }

  .inner { overflow: hidden; width: 100%; height: 100%; border-radius: inherit; padding: var(--pt, 0px) 16px 0; }

  body[data-open="true"] .notch { width: 440px; height: var(--h, 172px); border-radius: 0 0 28px 28px; }

  /* header row, always visible */
  .head { height: 34px; display: flex; align-items: center; gap: 9px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 12px var(--accent); flex: none;
    transition: background .3s, box-shadow .3s;
  }
  .title { font-weight: 600; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .meta { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }

  /* phase colours */
  body[data-phase="idle"]    { --accent: var(--dim); }
  body[data-phase="scanning"]{ --accent: var(--scan); }
  body[data-phase="pass"]    { --accent: var(--ok); }
  body[data-phase="powered"] { --accent: var(--ok); }
  body[data-phase="fault"]   { --accent: var(--warn); }
  body[data-phase="fault"][data-critical="true"], body[data-phase="cut"] { --accent: var(--bad); }
  body[data-phase="scanning"] .dot { animation: pulse .9s ease-in-out infinite; }
  body[data-phase="cut"] .dot, body[data-critical="true"] .dot { animation: pulse .6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.5); opacity: .55; } }

  /* body of the open notch */
  .body { opacity: 0; transform: translateY(-6px); transition: opacity .3s .1s, transform .45s .05s var(--ease); }
  body[data-open="true"] .body { opacity: 1; transform: none; }

  .strip { display: block; width: 100%; height: 76px; margin-top: 0; }
  .strip .row { fill: var(--faint); transition: fill .3s; }
  .strip .row.hot { fill: var(--accent); filter: drop-shadow(0 0 5px var(--accent)); }
  .strip .num { fill: var(--dim); font-size: 8.5px; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .strip .num.hot { fill: var(--ink); font-weight: 700; }
  .strip .arc { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw .6s var(--ease) both; }
  .strip .arc.missing { stroke-dasharray: 4 5; animation: none; stroke-dashoffset: 0; opacity: .9; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .sweep { fill: var(--scan); opacity: 0; }
  body[data-phase="scanning"] .sweep { animation: sweep 0.9s linear infinite; }
  @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: .35; } 85% { opacity: .35; } 100% { opacity: 0; transform: translateX(380px); } }


  /* all clear: ring burst, circle draws, check draws, rows light up in a wave */
  .okrow { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .okrow .txt .msg { margin-top: 0; }
  .ok-badge { width: 44px; height: 44px; flex: none; overflow: visible; animation: okpop .5s .85s var(--ease); }
  .ok-badge .disc { fill: rgba(50, 215, 75, .14); stroke: var(--ok); stroke-width: 2.5; stroke-dasharray: 126; stroke-dashoffset: 126; transform: rotate(-90deg); transform-origin: 22px 22px; animation: okdraw .55s var(--ease) forwards; }
  .ok-badge .tick { fill: none; stroke: var(--ok); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 32; stroke-dashoffset: 32; animation: okdraw .4s .45s var(--ease) forwards; }
  .ok-badge .ring { fill: none; stroke: var(--ok); stroke-width: 2; opacity: 0; transform-origin: 22px 22px; animation: okring .9s .45s ease-out; }
  @keyframes okdraw { to { stroke-dashoffset: 0; } }
  @keyframes okpop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @keyframes okring { 0% { opacity: .8; transform: scale(.9); } 100% { opacity: 0; transform: scale(2.1); } }
  .strip .row.ok { fill: var(--ok); filter: drop-shadow(0 0 4px var(--ok)); transform-box: fill-box; transform-origin: center; animation: rowok .5s both; }
  @keyframes rowok { from { fill: var(--faint); filter: none; transform: scaleY(.55); } 60% { transform: scaleY(1.15); } to { transform: scaleY(1); } }

  .msg { margin-top: 6px; font-size: 14px; font-weight: 600; }
  .fix { margin-top: 2px; color: var(--dim); font-size: 13px; }
  .fix b { color: var(--accent); font-weight: 600; }
  .live { display: flex; gap: 10px; margin-top: 10px; }
  .live div { flex: 1; background: rgba(255,255,255,.07); border-radius: 12px; padding: 8px 10px; }
  .live small { display: block; color: var(--dim); font-size: 11px; }
  .live span { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .live span i { font-style: normal; font-size: 11px; color: var(--dim); margin-left: 2px; }

  /* live wiring map */
  body[data-phase="idle"][data-links="true"] { --accent: var(--scan); }
  .strip .arc.link { stroke: var(--scan); }
  .strip .arc.okarc { stroke: var(--ok); }
  .strip .arc.bad { stroke: var(--bad); stroke-width: 2.5; }
  .steps { list-style: none; padding: 0; margin-top: 4px; display: grid; gap: 3px; font-size: 12.5px; counter-reset: s; }
  .steps li { display: flex; gap: 8px; color: var(--ink); counter-increment: s; }
  .steps li::before { content: counter(s); flex: none; width: 17px; height: 17px; border-radius: 50%; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; background: rgba(255,255,255,.12); }
  .steps li.remove::before { background: var(--bad); color: #000; }
  .steps li.add::before { background: var(--warn); color: #000; }
  .steps .more { color: var(--dim); padding-left: 25px; }
  .steps .more::before { display: none; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .acts button { font: inherit; font-size: 12px; color: var(--ink); background: rgba(255,255,255,.1); border: 0; padding: 6px 13px; border-radius: 999px; cursor: pointer; transition: background .2s; }
  .acts button:hover { background: rgba(255,255,255,.18); }
  .acts button.primary { background: var(--scan); color: #000; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 4px; }
  .chips span { font-size: 11.5px; font-variant-numeric: tabular-nums; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--dim); }

  body[data-phase="cut"] .notch, body[data-critical="true"] .notch { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-50%) translateX(-5px); } 40% { transform: translateX(-50%) translateX(5px); } 60% { transform: translateX(-50%) translateX(-3px); } 80% { transform: translateX(-50%) translateX(2px); } }

  /* ---------- demo panel (press d) ---------- */
  .dev { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
  body.dev .dev { display: flex; }
  .dev button {
    font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: background .2s;
  }
  .dev button:hover { background: rgba(255,255,255,.16); }
  .hint { position: fixed; bottom: 14px; width: 100%; text-align: center; color: rgba(255,255,255,.22); font-size: 11px; }
  body.dev .hint, body.nohint .hint { display: none; }
</style>
</head>
<body data-phase="idle" data-open="false">

<div class="notch" id="notch">
  <div class="inner">
    <div class="head">
      <div class="dot"></div>
      <div class="title" id="title">ready</div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="body" id="bodyEl"></div>
  </div>
</div>

<div class="dev">
  <button data-go="/api/check">check wiring</button>
  <button data-go="/api/power-on">power on</button>
  <button data-go="/api/power-off">power off</button>
  <button data-go="/api/sim/reset">sim: bad build</button>
  <button data-go="/api/sim/rail-short">sim: rail short</button>
  <button data-go="/api/sim/fix">sim: fix it</button>
  <button data-go="/api/sim/overload">sim: overload</button>
  <button data-go="/api/sim/overheat">sim: overheat</button>
</div>
<div class="hint">press d for the demo panel</div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
if (params.has('overlay')) document.body.classList.add('overlay');
const NH = Number(params.get('nh')) || 0, NW = Number(params.get('nw')) || 0;
if (params.has('native')) {
  document.body.classList.add('native');
  if (NW && NH) {
    document.documentElement.style.setProperty('--nw', NW + 'px');
    document.documentElement.style.setProperty('--nh', NH + 'px');
    document.documentElement.style.setProperty('--pt', NH + 'px');   // content hangs below the hardware notch
  }
}
if (params.has('dev')) document.body.classList.add('dev');
if (params.has('demo')) document.body.classList.add('nohint');
addEventListener('keydown', (e) => { if (e.key === 'd') document.body.classList.toggle('dev'); });
const KEY = params.get('key') || '';
document.querySelectorAll('[data-go]').forEach((b) =>
  b.addEventListener('click', () => fetch(b.dataset.go, { method: 'POST', headers: KEY ? { 'x-hub-token': KEY } : {} }).catch(() => {})));

const X0 = 14, STEP = (440 - 32 - 28) / 15;       // row x positions inside the strip
const rowX = (n) => X0 + (n - 1) * STEP;

function strip(state, hot, arcs, allOk = false) {
  let s = `<svg class="strip" viewBox="0 0 408 76" aria-hidden="true">`;
  s += `<rect class="sweep" x="0" y="26" width="22" height="26" rx="11"/>`;
  for (let n = 1; n <= 16; n++) {
    const isHot = hot.has(n);
    s += `<rect class="row ${isHot ? 'hot' : ''} ${allOk ? 'ok' : ''}" ${allOk ? `style="animation-delay:${0.9 + n * 0.045}s"` : ''} x="${rowX(n) - 4}" y="${isHot ? 28 : 32}" width="8" height="${isHot ? 28 : 20}" rx="4"/>`;
    s += `<text class="num ${isHot ? 'hot' : ''}" x="${rowX(n)}" y="70">${n}</text>`;
  }
  // one arch per hop, so a path like 1 > 5 > 6 > 2 reads as a chain
  for (const a of arcs) {
    for (let i = 0; i < a.rows.length - 1; i++) {
      const x1 = rowX(a.rows[i]), x2 = rowX(a.rows[i + 1]);
      const mid = (x1 + x2) / 2, lift = Math.max(10, Math.min(46, Math.abs(x2 - x1) * 0.55));
      s += `<path class="arc ${a.kind || ''}" style="animation-delay:${0.15 + i * 0.18}s" d="M${x1} 26 Q${mid} ${26 - lift} ${x2} 26"/>`;
    }
  }
  return s + `</svg>`;
}

// ---- auto-dismiss: closes after 15 s, or when the pointer goes onto the notch and then off.
// a new event (phase or findings change) opens it again.
// a new event opens it again. hovering the closed notch peeks at the current board.
const DISMISS_MS = 15000;
let lastState = null, stateSig = '', open = false, hovered = false, timer = null, first = true;
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.notch;
function setOpen(v) {
  if (v === open) return;
  open = v;
  document.body.dataset.open = String(v);
  if (native) native.postMessage({ open: v });   // the app only takes clicks while open
}
const pinned = () => Boolean(lastState && (lastState.hold || lastState.test));
function closeLater() {
  clearTimeout(timer);
  timer = setTimeout(() => { if (!hovered && !pinned()) setOpen(false); }, DISMISS_MS);
}
// the native app calls this from its mouse tracker
window.notchHover = (inside) => {
  if (inside) {
    hovered = true;
    clearTimeout(timer);
    if (!open && lastState) setOpen(true);
  } else if (hovered) {
    hovered = false;
    if (!pinned()) setOpen(false);   // a held notch, or a test in progress, never closes on its own
  }
};
document.getElementById('notch').addEventListener('mouseenter', () => window.notchHover(true));
document.getElementById('notch').addEventListener('mouseleave', () => window.notchHover(false));

const DEMO = params.has('demo');
const post = (path) => fetch(path, { method: 'POST', headers: KEY ? { 'x-hub-token': KEY } : {} }).catch(() => {});
const ACTIONS = { test: () => post('/api/test'), done: () => post('/api/test/end') };
$('bodyEl').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (b) ACTIONS[b.dataset.act]();
});

let last = '';
// the notch on a real hub shows one thing: the live wiring, rescanned every half second
function renderLive(st) {
  lastState = st;
  const links = st.links || [];
  const cut = st.phase === 'cut';
  const sigNow = JSON.stringify([links, st.power, cut]);
  if (sigNow !== stateSig) {
    stateSig = sigNow;
    const quiet = first && !links.length && !st.power && !cut;   // stay closed on a quiet start
    first = false;
    if (!quiet) {
      setOpen(true);
      closeLater();
    }
  }
  const n = links.length;
  document.body.dataset.phase = cut ? 'cut' : st.power ? 'powered' : 'idle';
  document.body.dataset.critical = String(cut);
  document.body.dataset.links = String(n > 0);
  $('title').textContent = n ? `${n} connection${n === 1 ? '' : 's'}` : 'no connections';
  $('meta').textContent = cut ? 'power cut' : st.power ? 'power on' : st.project ? st.project : st.mode === 'sim' ? 'live · sim' : 'live';

  const sig = JSON.stringify(['live', links, st.project, st.power]);
  if (sig === last) return;
  last = sig;
  $('bodyEl').innerHTML = strip(st, new Set(links.flat()), links.map(([a, b]) => ({ kind: 'link', rows: [a, b] }))) +
    (n ? `<div class="chips">${links.map(([a, b]) => `<span>${a}–${b}</span>`).join('')}</div>`
       : `<div class="fix">wire a jumper between two rows and it shows up here</div>`) +
    (st.project && !st.power ? `<div class="acts"><button class="primary" data-act="test">Test Notch</button></div>` : '');
  $('notch').style.setProperty('--h', 34 + 76 + 28 + 12 + (st.project && !st.power ? 38 : 0) + NH + 'px');
}

// "Test Notch": the project's diagram against what is wired, and the fixes in order
function renderTest(st) {
  lastState = st;
  const t = st.test;
  const sigNow = JSON.stringify(['test', t.ok, t.steps]);
  if (sigNow !== stateSig) {
    stateSig = sigNow;
    first = false;
    setOpen(true);
    clearTimeout(timer);
  }
  document.body.dataset.phase = t.ok ? 'pass' : 'fault';
  document.body.dataset.critical = String(Boolean(t.danger));
  $('title').textContent = t.ok ? 'wired correctly' : t.danger ? 'danger: do not plug in power' : `${t.steps.length} fix${t.steps.length === 1 ? '' : 'es'} needed`;
  $('meta').textContent = st.project || '';

  const sig = JSON.stringify(['test', t]);
  if (sig === last) return;
  last = sig;
  const arcs = [
    ...t.expected.map((e) => ({ kind: e.wired ? 'okarc' : 'missing', rows: e.rows })),
    ...t.steps.filter((s) => s.action === 'remove').map((s) => ({ kind: 'bad', rows: s.rows })),
  ];
  const hot = new Set(t.steps.flatMap((s) => s.rows));
  const MAX = 4, shown = t.steps.slice(0, MAX);
  let html = strip(st, hot, arcs, t.ok);
  if (t.ok) {
    html += `<div class="msg">matches the wiring diagram</div><div class="fix">every link is in place and nothing extra touches. safe to power on.</div>`;
  } else {
    html += `<ol class="steps">${shown.map((s) => `<li class="${s.action}">${esc(s.text)}</li>`).join('')}` +
      (t.steps.length > MAX ? `<li class="more">and ${t.steps.length - MAX} more</li>` : '') + `</ol>`;
  }
  html += `<div class="acts"><button class="primary" data-act="test">Test again</button><button data-act="done">Done</button></div>`;
  const lines = t.ok ? 2 : shown.length + (t.steps.length > MAX ? 1 : 0);
  $('bodyEl').innerHTML = html;
  $('notch').style.setProperty('--h', 34 + 76 + 8 + lines * 20 + 48 + 10 + NH + 'px');
}

// the landing page loop and a staged demo fault (/api/stage) use the full fault display
function render(st) {
  if (!DEMO && !st.staged) return st.test ? renderTest(st) : renderLive(st);
  lastState = st;
  const sigNow = JSON.stringify([st.phase, st.findings]);
  if (sigNow !== stateSig) {
    stateSig = sigNow;
    setOpen(st.phase !== 'idle');   // idle means closed
  }
  // a held notch (demo) stays open, whatever else happens, until the hold is released
  if (st.hold) { setOpen(true); clearTimeout(timer); }
  const faulty = st.phase === 'fault' || st.phase === 'cut';
  const critical = st.findings.some((f) => f.severity === 'critical') || st.phase === 'cut';
  document.body.dataset.phase = st.phase;
  document.body.dataset.critical = String(critical && faulty);

  $('title').textContent = st.phase === 'fault' ? (critical ? 'danger: do not power on' : 'wiring issue') : st.headline;
  $('meta').textContent =
    st.staged ? 'demo' :
    st.phase === 'powered' ? (st.telemetry.sensed === false ? 'on' : `${(st.telemetry.mv / 1000).toFixed(2)} v`) :
    st.phase === 'fault' ? `${st.findings.length} issue${st.findings.length === 1 ? '' : 's'}` :
    st.mode === 'sim' ? 'sim' : '';

  // rebuild the body only when the content changes, so animations are not restarted
  const sig = JSON.stringify([st.phase, st.findings, st.phase === 'powered' ? Math.round(st.telemetry.ma / 5) : 0]);
  if (sig === last) return;
  last = sig;

  const hot = new Set(), arcs = [];
  st.findings.forEach((f) => { f.rows.forEach((r) => hot.add(r)); if (f.rows.length >= 2) arcs.push(f); });
  let html = '', h = 172;

  if (st.phase === 'scanning') {
    html = strip(st, hot, arcs) + `<div class="msg">scanning 16 rows</div><div class="fix">checking every connection with power off</div>`;
    h = 162;
  } else if (st.phase === 'pass') {
    html = strip(st, hot, arcs, true) +
      `<div class="okrow">
        <svg class="ok-badge" viewBox="0 0 44 44" aria-hidden="true">
          <circle class="ring" cx="22" cy="22" r="20"/>
          <circle class="disc" cx="22" cy="22" r="20"/>
          <path class="tick" d="M13 23 l7 7 l12 -14"/>
        </svg>
        <div class="txt"><div class="msg">no faults found</div><div class="fix">wiring matches the plan. safe to power on.</div></div>
      </div>`;
    h = 168;
  } else if (faulty) {
    const f = st.findings[0];
    html = strip(st, hot, arcs) +
      `<div class="msg">${esc(f.message)}</div><div class="fix"><b>fix</b> ${esc(f.fix)}</div>` +
      (st.findings.length > 1 ? `<div class="fix" style="margin-top:6px">and ${st.findings.length - 1} more</div>` : '');
    h = st.findings.length > 1 ? 200 : 180;
    if (st.phase === 'cut') h = 172;
  } else if (st.phase === 'powered') {
    const t = st.telemetry;
    if (t.sensed === false) {
      // no current sensor: say so, instead of showing a made-up 0 ma
      html = `<div class="live">
        <div><small>power</small><span>on</span></div>
        <div><small>current</small><span style="font-size:14px;color:var(--warn)">not measured</span></div>
        <div><small>temp</small><span>${Math.round(t.tc)}<i>c</i></span></div></div>
        <div class="fix" style="margin-top:10px"><b style="color:var(--warn)">no current sensor</b> the board cannot cut power on overload. watch the circuit.</div>`;
      h = 158;
    } else {
      html = `<div class="live">
        <div><small>voltage</small><span>${(t.mv / 1000).toFixed(2)}<i>v</i></span></div>
        <div><small>current</small><span>${Math.round(t.ma)}<i>ma</i></span></div>
        <div><small>temp</small><span>${Math.round(t.tc)}<i>c</i></span></div></div>
        <div class="fix" style="margin-top:10px">watching voltage, current and temperature.</div>`;
      h = 150;
    }
  }
  $('bodyEl').innerHTML = html;
  $('notch').style.setProperty('--h', h + NH + 'px');
}
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function connect() {
  const es = new EventSource('/events');
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
if (params.has('demo')) {
  // scripted loop for the landing page. no hub needed.
  const plan = { name: 'sensor hookup' };
  const base = { links: [], power: false, telemetry: { mv: 0, ma: 0, tc: 0 }, cutReason: null, plan, mode: 'sim' };
  const F = (kind, rows, severity, message, fix) => ({ kind, rows, severity, message, fix });
  const steps = [
    [1400, { phase: 'idle', headline: 'ready', findings: [] }],
    [1700, { phase: 'scanning', headline: 'scanning', findings: [] }],
    [4200, { phase: 'fault', headline: '', findings: [
      F('rail_short', [1, 5, 6, 2], 'critical', 'ground is connected to power (rows 1 \u2192 5 \u2192 6 \u2192 2)', 'do not plug in power: remove the wire between rows 5 and 6'),
      F('missing', [7, 10], 'warn', 'row 7 and row 10 are not connected', 'add a jumper from row 7 to row 10')] }],
    [1500, { phase: 'scanning', headline: 'scanning', findings: [] }],
    [3200, { phase: 'fault', headline: '', findings: [F('missing', [7, 10], 'warn', 'row 7 and row 10 are not connected', 'add a jumper from row 7 to row 10')] }],
    [1400, { phase: 'scanning', headline: 'scanning', findings: [] }],
    [2400, { phase: 'pass', headline: 'all clear', findings: [] }],
    [3400, { phase: 'powered', headline: 'power on', power: true, findings: [], live: true }],
    [3800, { phase: 'cut', headline: 'power cut', cutReason: 'too much current', findings: [F('rail_short', [], 'critical', 'power cut: too much current', 'leave the power off, then run a wiring check to find the cause')] }],
  ];
  let i = 0;
  const play = () => {
    const [hold, st] = steps[i % steps.length];
    const t0 = performance.now();
    const tick = () => {
      const live = st.live ? { mv: 4980, ma: 52 + Math.round(8 * Math.sin((performance.now() - t0) / 300)), tc: 26 } : base.telemetry;
      render({ ...base, ...st, telemetry: live });
      if (performance.now() - t0 < hold) setTimeout(tick, st.live ? 250 : hold);
    };
    tick();
    i++;
    setTimeout(play, hold);
  };
  play();
} else {
  connect();
}
</script>
</body>
</html>
